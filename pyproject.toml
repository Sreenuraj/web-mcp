[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-mcp"
version = "0.1.0"
description = "Guard-railed, budgeted web research MCP server (search + fetch) for any MCP-capable agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sreenuraj" }]
keywords = ["mcp", "model-context-protocol", "web-search", "research", "agents", "guardrails"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "mcp>=1.10.0,<2",
  "httpx>=0.27",
  "pydantic>=2.6",
  "trafilatura>=1.12",
  "selectolax>=0.3.21",
  "pypdf>=4.0",
  "ddgs>=9.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
keyring = ["keyring>=25.0"]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Sreenuraj/web-mcp"
Issues = "https://github.com/Sreenuraj/web-mcp/issues"

[project.scripts]
web-mcp = "web_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/web_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP035", "B904", "B905", "E741"]
